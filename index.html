<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0221">
  <title>donut.exe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./ui/vapor.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; overscroll-behavior: none; }
    /* Exactly one screen: the donut takes whatever the controller window doesn't. */
    body {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--vw-night);
      color: var(--vw-text);
      font-family: var(--vw-font-body);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* ---- donut stage ---- */
    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .stage .vw-sky { position: absolute; inset: 0; }
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(closest-side at 50% 50%, var(--glow, rgba(255, 113, 206, 0.3)), transparent 75%);
      transition: background 0.4s;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ---- controller window ----
       The negative top margin slides it 28px up over the stage, so its frosted
       glass softly blurs the donut's bottom edge. */
    .controller {
      position: relative;
      z-index: 2;
      flex: none;
      margin: -28px 12px calc(12px + env(safe-area-inset-bottom));
      max-height: 62%;
      display: flex;
      flex-direction: column;
    }
    .controller .vw-window__body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
      overflow-y: auto;
    }
    .linked { display: inline-flex; align-items: center; gap: 6px; }
    [hidden] { display: none !important; }

    #tilt { flex-direction: column; gap: 2px; min-height: 64px; padding: 10px 16px; }
    #tilt .big { font-size: 30px; letter-spacing: 0.04em; }
    #tilt .small { font-size: 18px; opacity: 0.8; }

    .row { display: flex; align-items: center; gap: 10px; }
    .row .vw-label { flex: none; width: 52px; }
    .row .vw-slider { flex: 1; min-width: 0; }
    .row .vw-btn--icon { flex: none; }
    #speedValue { flex: none; width: 3.2ch; text-align: right; font-size: 22px; }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: -4px -14px;
      padding: 4px 14px 6px;
    }
    .chips::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="vw-sky"></div>
    <div class="glow" id="glow"></div>
    <div class="vw-grid"></div>
    <canvas id="stage" aria-label="spinning ASCII donut"></canvas>
  </div>

  <section class="vw-window vw-window--glass controller">
    <header class="vw-titlebar">
      <span class="vw-titlebar__title">donut.exe <span class="linked" id="linked" hidden>· <span class="vw-dot vw-dot--on"></span> terminal</span></span>
      <span class="vw-titlebar__ctl" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span>
    </header>
    <div class="vw-window__body">
      <button class="vw-btn vw-btn--glass vw-btn--block" id="tilt" aria-pressed="false">
        <span class="big" id="tiltBig">▶ tilt mode</span>
        <span class="small" id="tiltSmall">lay your phone flat for a top-down view</span>
      </button>

      <div class="row">
        <span class="vw-label">speed</span>
        <input class="vw-slider" id="speed" type="range" min="0" max="3" step="0.05" value="1" aria-label="speed">
        <span id="speedValue">1.0×</span>
        <button class="vw-btn vw-btn--icon" id="pause" aria-label="pause">❚❚</button>
      </div>

      <div class="row">
        <span class="vw-label">color</span>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </section>

  <div class="vw-scanlines"></div>

  <script type="module">
    import { THEMES, SHADES, xtermToCss, createGrid, render, createPose, setTilt, clearTilt, stepPose }
      from './src/donut-core.js';

    const $ = (id) => document.getElementById(id);
    const shared = { theme: 0, speed: 1, paused: false };
    const pose = createPose();
    let tiltOn = false;

    // ---- link to the terminal --------------------------------------------------
    // Opened from the QR code, this page drives your terminal: it sends its pose
    // and the terminal mirrors it. Opened as a plain website (GitHub Pages)
    // there's no terminal, so it just plays here.
    let ws;
    let everConnected = false;

    function setLinked(on) {
      $('linked').hidden = !on;
    }

    function connect() {
      if (location.hostname.endsWith('github.io')) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);
      ws.onopen = () => {
        everConnected = true;
        setLinked(true);
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.t === 'state') {
          Object.assign(shared, { theme: msg.theme, speed: msg.speed, paused: msg.paused });
          updateUI();
        }
      };
      ws.onclose = () => {
        setLinked(false);
        if (everConnected) setTimeout(connect, 1000); // no terminal behind this page → stay solo
      };
    }
    connect();

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    function change(settings) {
      Object.assign(shared, settings);
      updateUI();
      send({ t: 'set', ...settings });
    }

    // ---- controls ------------------------------------------------------------------
    const chips = THEMES.map((theme, i) => {
      const chip = document.createElement('button');
      chip.className = 'vw-chip';
      const c = theme.colors.map(xtermToCss);
      chip.innerHTML =
        `<span class="vw-chip__swatch" style="background: radial-gradient(circle at 35% 35%, ${c[11]}, ${c[6]} 55%, ${c[1]})"></span>${theme.name}`;
      chip.addEventListener('click', () => change({ theme: i }));
      $('chips').append(chip);
      return chip;
    });

    $('speed').addEventListener('input', (e) => change({ speed: Number(e.target.value), paused: false }));
    $('pause').addEventListener('click', () => change({ paused: !shared.paused }));

    function updateUI() {
      const colors = THEMES[shared.theme].colors;
      $('glow').style.setProperty('--glow', xtermToCss(colors[5]).replace('rgb', 'rgba').replace(')', ',0.45)'));
      chips.forEach((chip, i) => chip.setAttribute('aria-pressed', i === shared.theme));
      $('speed').value = shared.speed;
      $('speed').style.setProperty('--fill', `${(shared.speed / 3) * 100}%`);
      $('speedValue').textContent = shared.paused && !tiltOn ? '--' : `${shared.speed.toFixed(1)}×`;
      $('pause').textContent = shared.paused ? '▶' : '❚❚';
      $('pause').setAttribute('aria-label', shared.paused ? 'play' : 'pause');
      $('pause').disabled = tiltOn; // in tilt mode the slider sets the max turning speed instead
      $('tilt').setAttribute('aria-pressed', tiltOn);
      $('tiltBig').textContent = tiltOn ? '■ stop tilt' : '▶ tilt mode';
    }
    updateUI();

    // ---- tilt ----------------------------------------------------------------------
    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      setTilt(pose, e.beta, e.gamma);
    }

    async function enableTilt() {
      if (!window.isSecureContext) {
        $('tiltSmall').textContent = 'needs the https link';
        return;
      }
      // iOS asks for permission, and only from a tap.
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          if (await DeviceOrientationEvent.requestPermission() !== 'granted') {
            $('tiltSmall').textContent = 'motion access denied · reload to retry';
            return;
          }
        } catch (err) {
          $('tiltSmall').textContent = 'permission error: ' + err.message;
          return;
        }
      }
      window.addEventListener('deviceorientation', onOrientation);
      tiltOn = true;
      $('tiltSmall').textContent = 'flat = top-down · tilt to turn';
      try { await navigator.wakeLock?.request('screen'); } catch {}
      updateUI();
    }

    function disableTilt() {
      window.removeEventListener('deviceorientation', onOrientation);
      tiltOn = false;
      clearTilt(pose);
      $('tiltSmall').textContent = 'lay your phone flat for a top-down view';
      updateUI();
    }

    $('tilt').addEventListener('click', () => (tiltOn ? disableTilt() : enableTilt()));

    // ---- drawing ---------------------------------------------------------------------
    const canvas = $('stage');
    const ctx = canvas.getContext('2d');
    const FONT = 'ui-monospace, "SF Mono", Menlo, monospace';
    let grid, cellW, cellH, colorsCss;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = canvas.getBoundingClientRect();
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Big, chunky characters: ~28 across a phone, in a 1:2 terminal-shaped cell.
      cellW = Math.min(18, Math.max(11, width / 28));
      cellH = cellW * 2;
      grid = createGrid(Math.floor(width / cellW), Math.floor(height / cellH));
      // Size the font so one glyph is exactly one cell wide.
      ctx.font = `100px ${FONT}`;
      const glyph = ctx.measureText('M').width / 100;
      ctx.font = `bold ${cellW / glyph}px ${FONT}`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
    }
    window.addEventListener('resize', resize);
    resize();

    let last = performance.now();
    let sentAt = 0;
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;

      render(grid, stepPose(pose, dt, shared));

      // Keep the terminal in sync ~30 times a second.
      if (now - sentAt > 33) {
        send({ t: 'pose', q: pose.current, tilt: tiltOn });
        sentAt = now;
      }

      const { width, height } = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, width, height);
      const offsetX = (width - grid.width * cellW) / 2;
      const offsetY = (height - grid.height * cellH) / 2;
      colorsCss = THEMES[shared.theme].colors.map(xtermToCss);
      for (let i = 0; i < grid.shade.length; i++) {
        const s = grid.shade[i];
        if (s < 0) continue;
        ctx.fillStyle = colorsCss[s];
        ctx.fillText(
          SHADES[s],
          offsetX + (i % grid.width + 0.5) * cellW,
          offsetY + (Math.floor(i / grid.width) + 0.5) * cellH,
        );
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
