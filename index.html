<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0221">
  <title>DOUGHNUT3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./ui/vapor.css">
  <style>
    * { box-sizing: border-box; }
    /* Everything is sized in rem, and rem follows the screen, so the whole page
       keeps its proportions from a small phone up to a big monitor. */
    html { font-size: clamp(13px, 1.6vmin + 7px, 19px); }
    html, body { margin: 0; overflow: hidden; overscroll-behavior: none; }
    body {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--vw-night);
      color: var(--vw-text);
      font-family: var(--vw-font-body);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      --gap: clamp(10px, 2.2vmin, 24px);
    }

    /* ---- full-screen backdrop: sky + grid floor, tinted by the color theme ----
       The theme sets --sky-1/2/3 and --vw-grid-line from JS; @property lets
       the gradient colors animate smoothly when the theme changes. */
    @property --sky-1 { syntax: '<color>'; inherits: true; initial-value: #36055e; }
    @property --sky-2 { syntax: '<color>'; inherits: true; initial-value: #8700d7; }
    @property --sky-3 { syntax: '<color>'; inherits: true; initial-value: #ff5fd7; }
    @property --vw-grid-line { syntax: '<color>'; inherits: true; initial-value: #ff71ce; }
    /* Only fade between themes after the first paint, so a ?theme= link opens
       straight on its colors instead of fading in from the default. */
    body.ready { transition: --sky-1 0.8s, --sky-2 0.8s, --sky-3 0.8s, --vw-grid-line 0.8s; }
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(180deg,
        var(--vw-night) 0%,
        color-mix(in srgb, var(--sky-1) 55%, var(--vw-night)) 40%,
        var(--sky-2) 82%,
        var(--sky-3) 130%);
      overflow: hidden;
    }
    .backdrop .vw-grid { height: 50%; opacity: 0.4; }

    /* ---- donut stage: floats in the top half, logo on top ---- */
    .stage {
      position: relative;
      z-index: 1;
      flex: 0 1 58%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .glow { position: absolute; inset: 0; }
    .glow {
      background: radial-gradient(closest-side at 50% 55%, var(--glow, rgba(255, 113, 206, 0.3)), transparent 75%);
      transition: background 0.4s;
    }
    .masthead {
      position: relative;
      z-index: 2;
      flex: none;
      padding: calc(var(--gap) + env(safe-area-inset-top)) var(--gap) 0;
      text-align: center;
    }
    .masthead .vw-logo { font-size: clamp(26px, 7vmin, 60px); }
    .masthead .vw-caption { display: flex; justify-content: center; margin-top: 0.5rem; }
    .canvas-wrap { position: relative; z-index: 1; flex: 1; min-height: 0; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ---- HUD: four direction arrows floating above the controller ----
       margin-top: auto pushes the HUD and controller to the bottom together. */
    .hud {
      position: relative;
      z-index: 2;
      flex: none;
      display: flex;
      justify-content: center;
      gap: clamp(0.75rem, 5vmin, 2.5rem);
      margin: auto 0 0;
      padding: 0.25rem 0 0.625rem;
    }

    /* ---- controller: a glass panel at the bottom, over the grid floor ---- */
    .controller {
      position: relative;
      z-index: 2;
      flex: none;
      width: min(100% - 2 * var(--gap), 30rem);
      max-height: 60%;
      margin: 0 auto calc(var(--gap) + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .controller .vw-window__body {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      padding: 0.875rem;
      overflow-y: auto;
      border-radius: inherit;
    }
    [hidden] { display: none !important; }

    #start { min-height: 3.5rem; font-size: 2.25rem; letter-spacing: 0.3em; padding-left: 1.3em; }

    .row { display: flex; align-items: center; gap: 0.625rem; }
    .row .vw-label { flex: none; width: 3.4rem; }
    .row .vw-slider { flex: 1; min-width: 0; }
    .row .vw-btn--icon { flex: none; }
    #speedValue { flex: none; width: 3.6ch; margin-right: 0.75rem; text-align: right; font-size: 1.375rem; }

    /* Chips scroll sideways. Edges that have more chips past them fade out
       (--fade-l / --fade-r are set from JS), so nothing touches the panel edge. */
    .chips {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      margin: -0.25rem 0;
      padding: 0.25rem 0.375rem 0.375rem 0.125rem;
      --fade-l: 0px;
      --fade-r: 0px;
      -webkit-mask-image: linear-gradient(to right,
        transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
      mask-image: linear-gradient(to right,
        transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
    }
    .chips::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="vw-grid"></div></div>

  <div class="stage">
    <div class="glow" id="glow"></div>
    <header class="masthead">
      <!-- easter egg: the logo opens the design system -->
      <a class="vw-logo" href="./design-system.html" data-glitch-link>DOUGHNUT3D</a>
      <a class="vw-caption" href="https://github.com/blu-octopus/terminal-donut" target="_blank" rel="noopener">made by <b>blu-octopus</b> · source ↗</a>
    </header>
    <div class="canvas-wrap"><canvas id="stage" aria-label="spinning ASCII donut"></canvas></div>
  </div>

  <!-- lights up with the direction the donut is moving, like a racing-game HUD;
       tap an arrow to lock the donut into turning only that way -->
  <div class="hud" id="hud" role="group" aria-label="steer"></div>

  <section class="vw-window vw-window--glass controller" aria-label="controls">
    <div class="vw-window__body">
      <button class="vw-btn vw-btn--glass vw-btn--block" id="start" aria-pressed="false">START</button>

      <div class="row">
        <span class="vw-label">speed</span>
        <input class="vw-slider" id="speed" type="range" min="0" max="3" step="0.05" value="1" aria-label="speed">
        <span id="speedValue">1.0×</span>
        <button class="vw-btn vw-btn--icon" id="pause" aria-label="pause">❚❚</button>
        <button class="vw-btn vw-btn--icon" id="sound" aria-label="sound" hidden>♪</button>
      </div>

      <div class="row">
        <span class="vw-label">color</span>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </section>

  <div class="vw-scanlines"></div>

  <script type="module">
    import { THEMES, SHADES, xtermToCss, createGrid, render, createPose, setTilt, setJoystick, clearTilt, stepPose }
      from './src/donut-core.js';
    import { sfx, haptic } from './ui/vapor-fx.js';
    import { createArrowButton, applyArrowTheme } from './ui/vapor-arrows.js';

    const $ = (id) => document.getElementById(id);

    // Desktop (mouse/trackpad): the mouse tilts the donut, and buttons make sounds.
    // Phone: the phone itself tilts the donut, and buttons buzz.
    // ?input=tilt forces phone-tilt mode on any device (for testing with DevTools
    // sensor emulation, and for the demo recorder in tools/).
    const desktop = matchMedia('(hover: hover) and (pointer: fine)').matches &&
      new URLSearchParams(location.search).get('input') !== 'tilt';

    function feedback(sound, arg) {
      if (desktop) sfx.play(sound, arg);
      else haptic();
    }

    // Logo glitches out, then opens the design system.
    document.querySelectorAll('[data-glitch-link]').forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        try {
          feedback('glitch');
        } catch {} // sound/haptics are a bonus; never let them block the link
        const go = () => (location.href = link.href);
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return go();
        link.classList.add('vw-logo--glitch');
        setTimeout(go, 300);
      });
    });

    // ?theme=ocean in the URL picks the starting color (handy for sharing links).
    const urlTheme = THEMES.findIndex((t) => t.name === new URLSearchParams(location.search).get('theme'));
    const shared = { theme: Math.max(0, urlTheme), speed: 1, paused: false };
    const pose = createPose();
    let tiltOn = false;
    let lockedDir = null; // 'left' | 'up' | 'down' | 'right' while an arrow is selected
    const arrows = {}; // HUD arrow buttons, filled in by the direction HUD section

    function change(settings) {
      Object.assign(shared, settings);
      updateUI();
    }

    // ---- controls ------------------------------------------------------------------
    const chips = THEMES.map((theme, i) => {
      const chip = document.createElement('button');
      chip.className = 'vw-chip';
      const c = theme.colors.map(xtermToCss);
      chip.innerHTML =
        `<span class="vw-chip__swatch" style="background: radial-gradient(circle at 35% 35%, ${c[11]}, ${c[6]} 55%, ${c[1]})"></span>${theme.name}`;
      chip.addEventListener('click', () => {
        feedback('select', i);
        change({ theme: i });
      });
      $('chips').append(chip);
      return chip;
    });

    // Fade whichever edge of the chip row still has chips hidden past it.
    function updateChipFade() {
      const row = $('chips');
      const max = row.scrollWidth - row.clientWidth;
      row.style.setProperty('--fade-l', row.scrollLeft > 1 ? '2rem' : '0px');
      row.style.setProperty('--fade-r', row.scrollLeft < max - 1 ? '2.5rem' : '0px');
    }
    $('chips').addEventListener('scroll', updateChipFade, { passive: true });
    new ResizeObserver(updateChipFade).observe($('chips'));

    // The slider clicks at every quarter step, like a notched dial.
    let notch = Math.round(shared.speed * 4);
    $('speed').addEventListener('input', (e) => {
      const speed = Number(e.target.value);
      if (Math.round(speed * 4) !== notch) {
        notch = Math.round(speed * 4);
        if (desktop) sfx.play('tick', speed / 3);
        else haptic(5);
      }
      change({ speed, paused: false });
    });

    $('pause').addEventListener('click', () => {
      feedback('click');
      change({ paused: !shared.paused });
    });

    if (desktop) {
      $('sound').hidden = false;
      $('sound').addEventListener('click', () => {
        sfx.setEnabled(!sfx.enabled);
        sfx.play('click');
        updateUI();
      });
    }

    function updateUI() {
      const colors = THEMES[shared.theme].colors;
      $('glow').style.setProperty('--glow', xtermToCss(colors[5]).replace('rgb', 'rgba').replace(')', ',0.45)'));
      // The whole sky follows the theme: dark tones up top, bright horizon below.
      const body = document.body.style;
      body.setProperty('--sky-1', xtermToCss(colors[1]));
      body.setProperty('--sky-2', xtermToCss(colors[3]));
      body.setProperty('--sky-3', xtermToCss(colors[8]));
      body.setProperty('--vw-grid-line', xtermToCss(colors[9]));
      // The HUD arrows wear the theme too.
      applyArrowTheme($('hud'), colors.map(xtermToCss));
      chips.forEach((chip, i) => chip.setAttribute('aria-pressed', i === shared.theme));
      $('speed').value = shared.speed;
      $('speed').style.setProperty('--fill', `${(shared.speed / 3) * 100}%`);
      const steering = tiltOn || lockedDir;
      $('speedValue').textContent = shared.paused && !steering ? '--' : `${shared.speed.toFixed(1)}×`;
      $('pause').textContent = shared.paused ? '▶' : '❚❚';
      $('pause').setAttribute('aria-label', shared.paused ? 'play' : 'pause');
      $('pause').disabled = !!steering; // while steering, the slider sets the turning speed instead
      for (const dir in arrows) arrows[dir].setAttribute('aria-pressed', lockedDir === dir);
      $('sound').textContent = sfx.enabled ? '♪' : '×';
      $('sound').setAttribute('aria-label', sfx.enabled ? 'sound on' : 'sound off');
      $('start').setAttribute('aria-pressed', tiltOn);
      // START begins tilting; AUTO hands the donut back to auto-spin.
      $('start').textContent = tiltOn ? 'AUTO' : 'START';
    }
    updateUI();
    requestAnimationFrame(() => document.body.classList.add('ready'));

    // Briefly show a problem on the button itself, then go back to START.
    function flashButton(text) {
      $('start').textContent = text;
      setTimeout(updateUI, 2500);
    }

    // ---- tilt: phone sensors ------------------------------------------------------------
    function onOrientation(e) {
      if (e.beta == null || e.gamma == null) return;
      setTilt(pose, e.beta, e.gamma);
    }

    async function enablePhoneTilt() {
      if (!window.isSecureContext) return flashButton('NEEDS HTTPS');
      // iOS asks for permission, and only from a tap.
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          if (await DeviceOrientationEvent.requestPermission() !== 'granted') return flashButton('NO ACCESS');
        } catch {
          return flashButton('NO ACCESS');
        }
      }
      window.addEventListener('deviceorientation', onOrientation);
      try { await navigator.wakeLock?.request('screen'); } catch {}
      return true;
    }

    // ---- steering: mouse as a joystick ------------------------------------------------
    // Where the cursor sits relative to the window's center sets a turning rate:
    // push further out to turn faster. The donut keeps turning while the cursor
    // stays put (steady speed, no build-up) and stops when you return to center.
    const DEAD_ZONE = 0.1; // fraction of the half-window around the center that means "stop"
    let pointer = null;

    function stick(n) {
      const mag = Math.min(1, Math.abs(n));
      if (mag < DEAD_ZONE) return 0;
      // Rescale past the dead zone, with a gentle curve for fine control near center.
      return Math.sign(n) * ((mag - DEAD_ZONE) / (1 - DEAD_ZONE)) ** 1.4;
    }

    function applyPointer() {
      const nx = pointer ? (pointer.x / innerWidth) * 2 - 1 : 0;
      const ny = pointer ? (pointer.y / innerHeight) * 2 - 1 : 0;
      setJoystick(pose, stick(nx), stick(-ny)); // screen y points down; stick y points up
    }
    window.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
      pointer = { x: e.clientX, y: e.clientY };
      if (tiltOn) applyPointer();
    });

    // ---- start / stop ---------------------------------------------------------------------
    $('start').addEventListener('click', async () => {
      // START takes over from a selected arrow: release it first, so even if
      // tilt can't start (e.g. no motion access) the donut goes back to auto-spin.
      if (lockedDir) {
        lockedDir = null;
        clearTilt(pose);
        updateUI();
      }
      if (tiltOn) {
        window.removeEventListener('deviceorientation', onOrientation);
        tiltOn = false;
        clearTilt(pose);
        feedback('stop');
      } else {
        if (desktop) applyPointer();
        else if (!(await enablePhoneTilt())) return;
        tiltOn = true;
        feedback('start');
      }
      updateUI();
    });

    // ---- drawing ---------------------------------------------------------------------
    const canvas = $('stage');
    const ctx = canvas.getContext('2d');
    const FONT = 'ui-monospace, "SF Mono", Menlo, monospace';
    let grid, cellW, cellH;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = canvas.getBoundingClientRect();
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Chunky 1:2 terminal cells, sized off the smaller side so the donut is
      // always ~22 characters across, never a tiny smudge or cut off.
      cellW = Math.max(5, Math.min(width / 28, height / 46));
      cellH = cellW * 2;
      grid = createGrid(Math.floor(width / cellW), Math.floor(height / cellH));
      // Size the font so one glyph is exactly one cell wide.
      ctx.font = `100px ${FONT}`;
      const glyph = ctx.measureText('M').width / 100;
      ctx.font = `bold ${cellW / glyph}px ${FONT}`;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
    }
    new ResizeObserver(resize).observe(canvas);
    resize();

    // ---- direction HUD ---------------------------------------------------------------
    // Follows the donut's face (the side you can see) across the screen: whichever
    // way it's moving lights that arrow, glowing harder the faster it goes.
    // Hysteresis: an arrow lights above ARROW_ON but only goes dark below ARROW_OFF,
    // so motion hovering near the threshold doesn't make it flicker.
    const ARROW_ON = 0.15; // screen units per second
    const ARROW_OFF = 0.07;
    const MIN_LIT_MS = 400; // once lit, an arrow stays lit at least this long
    const LOCKED_STICK = 0.6; // joystick deflection while an arrow is selected
    const DIRECTIONS = {
      left: { x: -1, y: 0 }, up: { x: 0, y: 1 }, down: { x: 0, y: -1 }, right: { x: 1, y: 0 },
    };
    Object.keys(DIRECTIONS).forEach((dir, i) => {
      arrows[dir] = createArrowButton(dir, `turn ${dir}`);
      arrows[dir].addEventListener('click', () => toggleLock(dir, i));
      $('hud').append(arrows[dir]);
    });

    // Tap an arrow: the donut turns steadily that way and only that way.
    // Tap it again to let go (back to auto-spin); tap another to switch.
    function toggleLock(dir, i) {
      if (tiltOn) {
        window.removeEventListener('deviceorientation', onOrientation);
        tiltOn = false;
      }
      if (lockedDir === dir) {
        lockedDir = null;
        clearTilt(pose);
        feedback('stop');
      } else {
        lockedDir = dir;
        setJoystick(pose, DIRECTIONS[dir].x * LOCKED_STICK, DIRECTIONS[dir].y * LOCKED_STICK);
        feedback('select', i);
      }
      updateUI();
    }
    const faceVelocity = { x: 0, y: 0 };
    let lastFace = null;

    function updateArrows(M, dt) {
      // The donut's axis, flipped if needed so it's the face pointing at us.
      const flip = M[7] > 0 ? -1 : 1;
      const face = { x: M[1] * flip, y: M[4] * flip, flip };
      if (lastFace && dt > 0 && face.flip === lastFace.flip) {
        const k = 1 - Math.exp(-8 * dt); // smooth so arrows don't flicker
        faceVelocity.x += ((face.x - lastFace.x) / dt - faceVelocity.x) * k;
        faceVelocity.y += ((face.y - lastFace.y) / dt - faceVelocity.y) * k;
      }
      lastFace = face;
      const push = { right: faceVelocity.x, left: -faceVelocity.x, up: faceVelocity.y, down: -faceVelocity.y };
      for (const dir in arrows) {
        const arrow = arrows[dir].arrow;
        let on, power;
        if (lockedDir) {
          // A selected arrow owns the HUD: only it lights, at full steady glow.
          on = dir === lockedDir;
          power = 1;
        } else {
          const wasOn = arrow.classList.contains('is-active');
          on = push[dir] > (wasOn ? ARROW_OFF : ARROW_ON) || (wasOn && performance.now() - arrow.litAt < MIN_LIT_MS);
          if (on && !wasOn) arrow.litAt = performance.now();
          power = Math.min(1, Math.max(0, push[dir]) / 1.2);
        }
        arrow.classList.toggle('is-active', on);
        arrow.style.setProperty('--power', power.toFixed(2));
      }
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;

      const M = stepPose(pose, dt, shared);
      render(grid, M);
      updateArrows(M, dt);

      const { width, height } = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, width, height);
      const offsetX = (width - grid.width * cellW) / 2;
      const offsetY = (height - grid.height * cellH) / 2;
      const colors = THEMES[shared.theme].colors.map(xtermToCss);
      for (let i = 0; i < grid.shade.length; i++) {
        const s = grid.shade[i];
        if (s < 0) continue;
        ctx.fillStyle = colors[s];
        ctx.fillText(
          SHADES[s],
          offsetX + (i % grid.width + 0.5) * cellW,
          offsetY + (Math.floor(i / grid.width) + 0.5) * cellH,
        );
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
